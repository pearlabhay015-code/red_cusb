<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Detail | Central University of South Bihar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/themes.css">
</head>
<body data-page="gallery-detail">
  <div data-component="header"></div>
  <main id="main-content" tabindex="-1" data-gallery-detail-page>
    <section class="page-hero">
      <div class="container">
        <span data-gallery-detail-category>Gallery</span>
        <h1 data-gallery-detail-title>Campus Gallery</h1>
        <p data-gallery-detail-summary>Explore a highlighted campus image from the university gallery.</p>
      </div>
    </section>

    <section class="container panel page-section section-gap gallery-detail-page">
      <img data-gallery-detail-image src="" alt="" loading="eager">
      <div class="gallery-detail-content">
        <h2>Image Details</h2>
        <p data-gallery-detail-text></p>
        <h3>Highlights</h3>
        <ul data-gallery-detail-highlights></ul>
        <a class="btn primary compact" href="../index.html#gallery-title">Back to Gallery <i data-lucide="arrow-left" aria-hidden="true"></i></a>
      </div>
    </section>
  </main>
  <div data-component="footer"></div>
  <dialog class="keyboard-dialog" data-keyboard-dialog aria-labelledby="keyboard-title">
    <h2 id="keyboard-title">Keyboard Navigation</h2>
    <p>Use Tab and Shift + Tab to move through links and controls. Press Escape to close dialogs and menus.</p>
    <button class="btn primary compact" type="button" data-dialog-close aria-label="Close keyboard navigation help">Close</button>
  </dialog>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="../js/components.js" defer></script>
  <script src="../js/theme.js" defer></script>
  <script src="../js/accessibility.js" defer></script>
  <script src="../js/main.js" defer></script>
</body>
</html>
